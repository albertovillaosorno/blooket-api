<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blooket Studio</title>
    <link rel="stylesheet" href="./popup.css" />
    <script type="module" src="./popup.js"></script>
  </head>
  <body>
    <header>
      <h1>Blooket Studio</h1>
      <select id="locale" aria-label="Language">
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
    </header>
    <p id="explanation"></p>
    <form id="connection">
      <label
        ><span id="urlLabel"></span>
        <input
          name="origin"
          type="url"
          required
          value="http://127.0.0.1:2607"
          autocomplete="off"
        />
      </label>
      <label
        ><span id="codeLabel"></span>
        <input
          name="token"
          type="password"
          required
          maxlength="43"
          autocomplete="off"
        />
      </label>
      <p id="codeHelp"></p>
      <button id="connect" type="submit"></button>
    </form>
    <button id="disconnect" type="button"></button>
    <p id="status" role="status" aria-live="polite"></p>
  </body>
</html>
