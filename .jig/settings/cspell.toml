domain = "cspell"
schema_version = 1
config_path = ".jig/cspell/cspell.json"
dictionary_root = ".jig/cspell"
files = ["**/*.{md,ts,toml,json,jsonc,yml,yaml}", ".editorconfig", ".gitignore"]
ignore_paths = [".cache/**", ".dependencies/**", ".git/**", ".logs/**", ".temp/**", "node_modules/**", "pnpm-lock.yaml"]
language = "en-US"
min_word_length = 3
schema = "https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json"
version = "0.2"

[dictionary.technical]
name = "blooket-api-technical"
path = ".jig/cspell/technical.txt"
