domain = "versions"
schema_version = 1

[authority.git-tool]
current = "2.55.0"
stable = "2.55.0"

[authority.git-tool.projection.tool]
kind = "tool"
target = "git"
template = "{version}"

[authority.node-types]
current = "24.19.1"
stable = "26.6.4"

[authority.node-types.freshness]
integrity_kind = "provider-response-sha256"
maximum_age_days = 1
provider = "npm-registry"
source = "https://registry.npmjs.org/@types%2fnode/latest"

[authority.node-types.projection.package]
kind = "package"
target = "@types/node"
template = "{version}"

[authority.node-types.skip.node_24_runtime]
evidence = "docs/technical/adr/node-24-type-compatibility.md"
expires_on = "2027-01-05"
owner = "repository-maintainers"
reason = "Node 24 runtime requires matching Node 24 declarations."
review_state = "approved"
scope = ["package"]
version = "26.6.4"

[authority.pnpm]
current = "12.9.1"
stable = "12.9.1"

[authority.pnpm.freshness]
integrity_kind = "provider-response-sha256"
maximum_age_days = 1
provider = "npm-registry"
source = "https://registry.npmjs.org/pnpm/latest"

[authority.pnpm.projection.package_manager]
kind = "package-manager"
target = "pnpm"
template = "pnpm@{version}"

[authority.python-tool]
current = "3.14.7"
stable = "3.14.7"

[authority.python-tool.projection.tool]
