domain = "commit"
schema_version = 1
allowed_scopes = ["api", "cli", "docs", "ir", "mcp", "media", "platforms", "projects", "repo", "security", "settings", "tests", "ui"]
allowed_trailers = ["BREAKING CHANGE", "Co-authored-by", "Signed-off-by"]
allowed_types = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "revert", "style", "test"]
allow_merge_commits = false
allow_revert_type = true
body_line_max_length = 80
body_min_length = 1
required_trailers = ["Signed-off-by"]
require_scope = true
subject_max_length = 72
