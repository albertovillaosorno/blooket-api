name: Verify source and native packages

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: npm run check
      - run: npm test
      - run: node --check src/ui/teacher-workspace/adapter-inbound/app.js
      - name: Validate repository with Jig
        uses: albertovillaosorno/jig@main
        with:
          root: .
          max-diagnostics: "1000"
          git-source-sha256: >-
            457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-x64
            runner: macos-26-intel
          - target: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: npm run check
      - run: npm test
      - name: Assemble native package
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: npm run package -- "$PACKAGE_TARGET"
      - name: Test the extracted package
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: npm run package:verify -- "$PACKAGE_TARGET"
      - name: Require Safari and trusted macOS signing for release
        if: inputs.release && startsWith(matrix.target, 'darwin-')
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: npm run package:verify -- "$PACKAGE_TARGET" --release
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: |
            .temp/distributions/${{ matrix.target }}.zip
            .temp/distributions/${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
