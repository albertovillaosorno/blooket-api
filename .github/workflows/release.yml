name: Release

on:
  push:
    tags: ["v20*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Require release flag and valid quarterly CalVer
        env:
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ENABLED" == true ]]
          node src/platforms/distribution/adapter-inbound/release-tag.ts \
            "$RELEASE_TAG"

  ci:
    needs: gate
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  publish:
    needs: [gate, ci]
    if: >-
      needs.gate.result == 'success' &&
      needs.ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: .temp/release-assets
          merge-multiple: true
      - name: Publish verified native archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          INCLUDE_LINUX: ${{ vars.RELEASE_INCLUDE_LINUX }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(.temp/release-assets/darwin-arm64.zip
                  .temp/release-assets/darwin-x64.zip)
          if [[ "$INCLUDE_LINUX" == true ]]; then
            assets+=(.temp/release-assets/linux-x64.tar.gz)
          fi
          for asset in "${assets[@]}"; do test -s "$asset"; done
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag --title "$RELEASE_TAG" --notes ""
