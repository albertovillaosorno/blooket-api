name: Release

on:
  push:
    tags: ["v[0-9][0-9].[1-4].*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  gate:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Require release flag and valid quarterly CalVer
        env:
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ENABLED" == true ]]
          node src/platforms/distribution/adapter-inbound/release-tag.ts \
            "$RELEASE_TAG"

  publish:
    needs: gate
    if: needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-darwin-arm64
          path: .temp/release-assets
          merge-multiple: true
      - name: Publish verified ARM64 archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          asset=.temp/release-assets/darwin-arm64.zip
          test -s "$asset"
          gh release create "$RELEASE_TAG" "$asset" \
            --verify-tag --title "$RELEASE_TAG" --notes ""
