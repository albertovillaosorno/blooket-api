name: CI

on:
  push:
    tags: ["ci-*"]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npm run check
      - run: npm run roadmap:check
      - run: npm test
      - name: Validate Linux development package
        shell: bash
        run: |
          set -euo pipefail
          npm run package -- linux-x64
          npm run package:verify -- linux-x64

  macos-arm:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Require Apple Silicon
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]]
          [[ "$(node -p process.arch)" == arm64 ]]
      - name: Build ARM64 package
        run: npm run package -- darwin-arm64
      - name: Verify ARM64 package
        run: npm run package:verify -- darwin-arm64
      - name: Assert ARM64 distribution archive
        shell: bash
        run: |
          set -euo pipefail
          test -s .temp/distributions/darwin-arm64.zip
      - name: Compile Safari WebExtension host
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .temp/safari-project
          extension_root=".temp/distributions/darwin-arm64"
          app_root="$extension_root/Blooket API.app"
          resources="$app_root/Contents/Resources"
          extension="$resources/extensions/chrome"
          packager_args=(
            "$extension"
            --project-location
            .temp/safari-project
            --app-name
            "Blooket API Safari"
            --bundle-identifier
            com.albertovilla.blooket-api.safari
            --swift
            --macos-only
            --copy-resources
            --no-open
            --no-prompt
          )
          xcrun safari-web-extension-packager "${packager_args[@]}"
          find_args=(
            .temp/safari-project
            -maxdepth
            2
            -name
            '*.xcodeproj'
            -print
            -quit
          )
          project="$(find "${find_args[@]}")"
          test -n "$project"
          schemes_json="$(xcodebuild -project "$project" -list -json)"
          scheme="$(
            printf '%s' "$schemes_json" |
              plutil -extract project.schemes.0 raw -o - -
          )"
          test -n "$scheme"
          derived_data=".temp/safari-derived"
          rm -rf "$derived_data"
          build_args=(
            -project
            "$project"
            -scheme
            "$scheme"
            -configuration
            Debug
            -derivedDataPath
            "$derived_data"
            -destination
            'platform=macOS,arch=arm64'
            CODE_SIGNING_ALLOWED=NO
            build
          )
          xcodebuild "${build_args[@]}"
          safari_app="$(
            find "$derived_data/Build/Products/Debug" -maxdepth 1 \
              -type d -name '*.app' -print -quit
          )"
          test -n "$safari_app"
          safari_root="$resources/Safari"
          companion="$safari_root/Blooket API Safari.app"
          rm -rf "$safari_root"
          mkdir -p "$safari_root"
          ditto "$safari_app" "$companion"
          appex="$(find "$companion" -type d -name '*.appex' \
            -print -quit)"
          test -n "$appex"
          extension_id="$(plutil -extract CFBundleIdentifier raw -o - \
            "$appex/Contents/Info.plist")"
          test -n "$extension_id"
          printf '%s\n' "$extension_id" > "$safari_root/extension-id.txt"
          helper_source="$resources/app/src/platforms/safari-extension"
          helper_source="$helper_source/adapter-outbound/open-extension.swift"
          xcrun swiftc \
            "$helper_source" \
            -framework SafariServices \
            -o "$safari_root/open-extension"
          chmod 755 "$safari_root/open-extension"
          rm -f .temp/distributions/darwin-arm64.zip
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_root" .temp/distributions/darwin-arm64.zip
          test -s .temp/distributions/darwin-arm64.zip
      - name: Exercise packaged workspace in Safari
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/safaridriver --enable
          npm run macos:safari-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: package-darwin-arm64
          path: .temp/distributions/darwin-arm64.zip
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
