name: CI

on:
  push:
    tags: ["ci-*"]
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-x64
            runner: macos-26-intel
          - target: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: npm run check
      - run: npm test
      - name: Assemble native package
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: npm run package -- "$PACKAGE_TARGET"
      - name: Verify extracted package
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          RELEASE_MODE: ${{ inputs.release }}
        shell: bash
        run: |
          if [[ "$PACKAGE_TARGET" == darwin-* ]] &&
             [[ "$RELEASE_MODE" == true ]]; then
            npm run package:verify -- "$PACKAGE_TARGET" --release
          else
            npm run package:verify -- "$PACKAGE_TARGET"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: |
            .temp/distributions/${{ matrix.target }}.zip
            .temp/distributions/${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
